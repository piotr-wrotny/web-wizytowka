<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wewnętrzny podgląd przewinięcia</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}iframe{display:block;border:0;margin:0}</style></head><body><iframe id="qa-frame" title="Prototyp przewinięty do wskazanego miejsca"></iframe><script>
// Dev-only helper for screenshots at a scroll position: ?w=1440&h=900&page=/&y=1200  or  ?to=podejscie&dy=400
const q=new URLSearchParams(location.search);const w=Math.max(320,Math.min(1600,Number(q.get('w'))||1440));const h=Math.max(400,Math.min(1800,Number(q.get('h'))||900));const requested=q.get('page')||'/';const safePath=requested.startsWith('/')&&!requested.startsWith('//')?requested:'/';const y=Number(q.get('y'))||0;const to=q.get('to');const dy=Number(q.get('dy'))||0;
const frame=document.getElementById('qa-frame');frame.width=w;frame.height=h;document.body.style.width=w+'px';document.body.style.height=h+'px';
frame.addEventListener('load',()=>{let tries=0;const tick=()=>{const win=frame.contentWindow,doc=win.document;const ready=doc.querySelector('main')&&(!to||doc.getElementById(to));if(!ready&&tries++<60){setTimeout(tick,100);return;}doc.documentElement.style.scrollBehavior='auto';if(q.get('notrans')){const st=doc.createElement('style');st.textContent='*{transition:none!important}';doc.head.appendChild(st);}let top=y;if(to){const el=doc.getElementById(to);if(el)top=el.getBoundingClientRect().top+win.scrollY+dy;}win.scrollTo({top,behavior:'instant'});win.dispatchEvent(new Event('scroll'));const probe=q.get('probe');if(probe){setTimeout(()=>{const out=[...doc.querySelectorAll(probe)].slice(0,6).map(el=>{const cs=win.getComputedStyle(el);const a=el.getAnimations({subtree:false}).map(x=>({name:x.animationName,t:x.effect&&x.effect.getComputedTiming().progress}));return{op:cs.opacity,top:Math.round(el.getBoundingClientRect().top),h:Math.round(el.getBoundingClientRect().height),a};});document.title='PROBE '+JSON.stringify(out);},600);}};setTimeout(tick,300);});
frame.src=safePath;
</script></body></html>
